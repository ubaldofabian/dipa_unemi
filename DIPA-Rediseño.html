<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DIPA-UNEMI — Rediseño · 3 variaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f4f4f1; font-family: 'Montserrat', sans-serif; }
  #root { height: 100%; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="variations/editorial.jsx"></script>
<script type="text/babel" src="variations/showcase.jsx"></script>
<script type="text/babel" src="variations/arquitectonica.jsx"></script>

<script type="text/babel">
  const ARTBOARD_W = 1440;
  const ARTBOARD_H = 5400;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="dipa-redesign" title="DIPA · UNEMI — Rediseño de la home" subtitle="3 direcciones visuales partiendo de los mismos colores institucionales (#002334 + #f37021) y Montserrat. Arrastra para reordenar, doble-click en el artboard para abrir en pantalla completa.">
          <DCArtboard id="editorial" label="A · Editorial Académica — Instrument Serif + whitespace" width={ARTBOARD_W} height={ARTBOARD_H}>
            <VariationEditorial />
          </DCArtboard>
          <DCArtboard id="showcase" label="B · Showcase Premium — inspirado en DJI, dark mode, contraste fuerte" width={ARTBOARD_W} height={ARTBOARD_H + 200}>
            <VariationShowcase />
          </DCArtboard>
          <DCArtboard id="arquitectonica" label="C · Arquitectónica — grid suizo, bloques de color, Source Serif" width={ARTBOARD_W} height={ARTBOARD_H}>
            <VariationArquitectonica />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
